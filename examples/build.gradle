
plugins {
    id ("application")
    id 'org.jetbrains.kotlin.jvm'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}
application {
    mainClass = "DriverKt"
}

dependencies {
    implementation(project(":libremidi-panama"))
    implementation 'com.fizzed:jne:4.3.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "org.scijava:native-lib-loader:2.5.0"
}
repositories {
    mavenCentral()
}

